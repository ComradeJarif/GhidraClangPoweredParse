name: Build Ghidra Extension

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Download Ghidra 12.1.4
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release download Ghidra_12.1.4_build -R NationalSecurityAgency/ghidra --pattern "*.zip"
          unzip -q ghidra_*.zip
          GHIDRA_DIR=$(find $GITHUB_WORKSPACE -maxdepth 1 -type d -name "ghidra_*_PUBLIC" | head -n 1)
          echo "GHIDRA_INSTALL_DIR=$GHIDRA_DIR" >> $GITHUB_ENV

      - name: Build Extension
        run: |
          chmod +x gradlew
          ./gradlew buildExtension

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: GhidraClangPoweredParse
          path: dist/*.zip
